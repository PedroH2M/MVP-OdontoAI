version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: odonto_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: odonto
      POSTGRES_PASSWORD: odonto_password
      POSTGRES_DB: odonto_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: odonto_ai_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
