services:
  - type: web
    name: odonto-ai-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:generate && npm --workspace=@odonto-ai/api run build
    startCommand: npm --workspace=@odonto-ai/api run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3333
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
